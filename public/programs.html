<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Programs | NITI</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://i.imgur.com/ySwYXym.jpeg">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Page Specific Styles for Programs -->
  <style>
    .page-header {
      padding: 10rem 2rem 4rem; 
      background: var(--primary); 
      text-align: center; 
      color: white;
    }
    .page-header h1 { 
      font-size: clamp(2.5rem, 5vw, 4rem); 
      color: white; 
      margin-bottom: 1rem; 
    }
    .page-header p { 
      color: var(--accent); 
      font-size: 1.1rem; 
    }

    /* Custom styling for program cards on the light background */
    .programs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .program-card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border-top: 4px solid var(--accent);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeUp 0.5s ease-out forwards;
      opacity: 0;
    }

    .program-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(10, 25, 47, 0.15);
      border-top-color: var(--primary);
    }

    .program-card i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
      transition: var(--transition);
    }

    .program-card:hover i {
      color: var(--accent);
      transform: scale(1.1);
    }

    .program-card h3 {
      color: var(--primary);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1.2rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="https://i.imgur.com/ySwYXym.jpeg" alt="NITI Logo">
        <div class="logo-text">
          <h1>NOLAN</h1>
          <span>Institute of Technology</span>
        </div>
      </a>
      
      <button class="hamburger" aria-label="Toggle navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="programs.html" class="active">Programs</a>
        <a href="campus.html">Campuses</a>
      </nav>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <section class="page-header">
    <h1>Academic Programs</h1>
    <p>Choose from a wide range of future-ready courses.</p>
  </section>

  <!-- DYNAMIC PROGRAMS GRID -->
  <section class="container" style="background: var(--bg-body); min-height: 50vh;">
    <!-- The ID here matches the JavaScript variable -->
    <div class="programs-grid" id="programs-grid">
      <!-- Cards will be injected here by main.js -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Nolan Institute of Technology. All Rights Reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
