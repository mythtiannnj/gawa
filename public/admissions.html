<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions | Nolan Institute</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo"><div class="logo-icon">N</div><div><h1>NOLAN</h1></div></div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="academics.html">Academics</a>
        <a href="campus.html">Campus</a>
        <a href="admissions.html" class="btn-apply active">Enroll Now</a>
      </nav>
    </div>
  </header>

  <div style="padding: 10rem 2rem 4rem; background: var(--primary); color: white; text-align: center;">
    <h1 style="font-size: 3rem;">Admissions</h1>
  </div>

  <section class="container">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 3rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <h2 class="section-title">Application Form</h2>
      
      <form id="applicationForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Select Course</label>
          <select id="course" required>
            <option value="">-- Select --</option>
            <option value="IT">Information Technology</option>
            <option value="CompEng">Computer Engineering</option>
            <option value="ElecEng">Electronics Engineering</option>
            <option value="CivilEng">Civil Engineering</option>
            <option value="BA">Business Administration</option>
          </select>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Submit Application</button>
        <div id="formMsg" style="margin-top: 1rem; text-align: center; font-weight: 600;"></div>
      </form>
    </div>
  </section>

  <footer><p>&copy; 2024 Nolan Institute of Technology.</p></footer>
  <script src="js/main.js"></script>
</body>
</html>
